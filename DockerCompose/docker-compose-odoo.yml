version: '3.8'

services:
  postgres:
    image: postgres:13
    container_name: odoo_db
    restart: always
    environment:
      POSTGRES_DB: odoo
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - odoo_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "odoo"]
      interval: 10s
      timeout: 5s
      retries: 5

  odoo:
    image: odoo:latest
    container_name: prestashop_odoo
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8069:8069"
    environment:
      DB_HOST: postgres
      DB_USER: odoo
      DB_PASSWORD: odoo
    volumes:
      - odoo_data:/var/lib/odoo

volumes:
  odoo_data:
  odoo_db_data:
